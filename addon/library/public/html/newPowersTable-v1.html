<style>
    /* Variabili colori (aggiungi ai tuoi globali) */
    :root {
        --bg-card: #2a2a2a;
    }

    .spell-row {
        display: flex;
        align-items: center;
        background-color: var(--bg-card);
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
        border: 1px solid #444;
        transition: transform 0.1s;
    }

    /* Bottone Icona */
    .spell-icon-btn {
        width: 40px;
        height: 40px;
        background: #444;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        margin-right: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Nome con categoria (Colori mantenuti) */
    .spell-name-badge {
        flex: 1;
        padding: 8px 12px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
    }

    /* Applichiamo i tuoi colori */
    .OFFENSIVO { background-color: #800000; color: white; }
    .MUTAFORMA { background-color: #CC6600; color: white; }
    /* ...eccetera per le altre classi... */

    /* Statistiche tattiche (stile compatto) */
    .spell-stats {
        display: flex;
        gap: 15px;
        margin-left: 20px;
    }

    .stat {
        text-align: center;
        font-size: 0.85rem;
    }

    .stat label {
        display: block;
        color: #888;
        font-size: 0.7rem;
        text-transform: uppercase;
    }
</style>

<!-- Esempio di una riga/card -->
<div class="spell-row">
    <button class="spell-icon-btn" title="Lancia">🔥</button>
    
    <div class="spell-name-badge OFFENSIVO">
        Dardo di Fuoco
    </div>

    <div class="spell-stats">
        <div class="stat"><label>Mana</label>5</div>
        <div class="stat"><label>PF</label>1</div>
        <div class="stat"><label>PA</label>2</div>
        <div class="stat"><label>TE</label>1</div>
    </div>
</div>
