<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Gabriela&family=New+Rocker&display=swap"
        rel="stylesheet">
    <style>
        /* --- VARIABILI DI TEMA (Condivise) --- */
        :root {
            --bg-card: #2a2a2a;
            --border-color: #444;
            --text-color: #ffffff;
            --accent-color: #c08a3e;
            --font-default: 'EB Garamond', serif;
            --font-spell: 'New Rocker', serif;
        }

        body {
            font-family: var(--font-default);
            font-size: 16px;
            background-color: #1a1a1a;
            color: var(--text-color);
            padding: 20px;
        }

        h2 {
            font-family: var(--font-spell);
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        /* --- GRIGLIA DEL GRIMORIO (Per righe) --- */
        .grimoire-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* --- CARD DEL LIBRO --- */
        .grimoire-card {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border-radius: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            gap: 10px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .grimoire-card:hover {
            border-color: #666;
            background-color: #323232;
        }

        /* Stato Memorizzato */
        .grimoire-card.memorized {
            border-color: var(--accent-color);
            background-color: rgba(192, 138, 62, 0.10);
        }

        /* Checkbox */
        .grimoire-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* --- BADGE DEL NOME (Riusato) --- */
        .spell-name-badge {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            font-family: var(--font-spell);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-image 0.2s ease, transform 0.1s ease;
        }

        .spell-name-badge:hover {
            transform: translateY(-1px);
            background-image: linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15));
        }

        /* Categorie di colore fisse */
        .OFFENSIVO {
            background-color: #800000;
            color: white;
        }

        .SUPPORTO {
            background-color: #0000FF;
            color: white;
        }

        .CONTROLLO {
            background-color: #008080;
            color: white;
        }

        .MALEDIZIONE {
            background-color: #4700B8;
            color: white;
        }

        .manaFont {
            color: #4d4dff;
            font-weight: bold;
        }

        .faticaFont {
            color: #ffd700;
            font-weight: bold;
        }

        .tempoFont {
            color: #32cd32;
            font-weight: bold;
        }

        .azioneFont {
            color: #ff4d4d;
            font-weight: bold;
        }

        .mmFont {
            color: #ff6600;
            font-weight: bold;
        }

        .ppFont {
            color: #bf00bf;
            font-weight: bold;
        }

        /* Pulsante di salvataggio stile card */
        .save-btn {
            background: #333;
            color: white;
            border-radius: 4px;
            border: 1px solid #555;
            cursor: pointer;
            padding: 6px 15px;
            font-family: var(--font-default);
            font-weight: bold;
            font-size: 1rem;
            margin-top: 15px;
            transition: background 0.15s ease;
        }

        .save-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .spell-stats-grid {
            display: grid;
            /* Usiamo 1fr per ogni colonna così tutti gli elementi rimangono allineati verticalmente */
            grid-template-columns: repeat(3, 1fr);
            gap: 2px 2px;
            font-size: 0.8rem;
            background: var(--stats-bg);
            padding: 3px 2px;
            border-radius: 4px;
            text-align: left;
            flex-shrink: 0;
            width: 160px;
            /* Dà una larghezza fissa complessiva al blocco stats, stabilizzandolo */
        }

        .stat-box {
            display: flex;
            gap: 3px;
            align-items: baseline;
            justify-content: flex-start;
            width: 100%;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--stat-label-color);
            /*font-weight: bold;*/
        }

        .stat-value {
            font-weight: bold;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            /* Mantiene il valore sulla stessa riga */
        }
    </style>
</head>

<body>

    <h2>Libro degli Incantesimi (Grimorio)</h2>

    <form>
        <div class="grimoire-grid-container">

            <!-- Incantesimo 1 (Memorizzato) -->
            <div class="grimoire-card memorized" onclick="toggleCard(this)">
                <input type="checkbox" name="memorizzati" checked class="grimoire-checkbox"
                    onclick="event.stopPropagation(); toggleCheckboxDirect(this)">

                <div class="spell-name-badge OFFENSIVO">Dardo di Fuoco</div>

                <!-- Riutilizziamo la stessa griglia delle statistiche delle spell card -->
                <div class="spell-stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">M:</span>
                        <span class="stat-value manaFont">5</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">PF:</span>
                        <span class="stat-value faticaFont">1</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">TE:</span>
                        <span class="stat-value tempoFont">1</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">PA:</span>
                        <span class="stat-value azioneFont">2</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">PP:</span>
                        <span class="stat-value ppFont">1</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">MM:</span>
                        <span class="stat-value mmFont">0</span>
                    </div>
                </div>
            </div>

            <!-- Incantesimo 2 (Non memorizzato) -->
            <div class="grimoire-card" onclick="toggleCard(this)">
                <input type="checkbox" name="memorizzati" class="grimoire-checkbox"
                    onclick="event.stopPropagation(); toggleCheckboxDirect(this)">
                <div class="spell-name-badge SUPPORTO">Scudo Protettivo</div>
            </div>

            <!-- Incantesimo 3 (Memorizzato) -->
            <div class="grimoire-card memorized" onclick="toggleCard(this)">
                <input type="checkbox" name="memorizzati" checked class="grimoire-checkbox"
                    onclick="event.stopPropagation(); toggleCheckboxDirect(this)">
                <div class="spell-name-badge CONTROLLO">Pugno d'Acciaio</div>
            </div>

            <!-- Incantesimo 4 (Non memorizzato) -->
            <div class="grimoire-card" onclick="toggleCard(this)">
                <input type="checkbox" name="memorizzati" class="grimoire-checkbox"
                    onclick="event.stopPropagation(); toggleCheckboxDirect(this)">
                <div class="spell-name-badge MALEDIZIONE">Oblio Mentale</div>
                <!-- Esempio di Card nel Grimoire con statistiche incluse -->
            </div>

            <!-- Incantesimo 5 (Non memorizzato) -->
            <div class="grimoire-card" onclick="toggleCard(this)">
                <input type="checkbox" name="memorizzati" class="grimoire-checkbox"
                    onclick="event.stopPropagation(); toggleCheckboxDirect(this)">
                <div class="spell-name-badge OFFENSIVO">Palla di Fuoco</div>
            </div>

            <!-- Incantesimo 6 (Memorizzato) -->
            <div class="grimoire-card memorized" onclick="toggleCard(this)">
                <input type="checkbox" name="memorizzati" checked class="grimoire-checkbox"
                    onclick="event.stopPropagation(); toggleCheckboxDirect(this)">
                <div class="spell-name-badge SUPPORTO">Cura Ferite</div>
            </div>

        </div>

        <button type="button" class="save-btn" onclick="alert('Simulazione salvataggio inviata al backend!')">Salva
            Memoria</button>
    </form>

    <script>
        // Cliccando sulla card si inverte lo stato del checkbox e della grafica
        function toggleCard(cardElement) {
            const checkbox = cardElement.querySelector('input[type="checkbox"]');
            if (checkbox) {
                checkbox.checked = !checkbox.checked;
                updateCardVisual(cardElement, checkbox.checked);
            }
        }

        // Se si clicca direttamente sul checkbox
        function toggleCheckboxDirect(checkbox) {
            const cardElement = checkbox.closest('.grimoire-card');
            updateCardVisual(cardElement, checkbox.checked);
        }

        // Gestione visiva della classe 'memorized'
        function updateCardVisual(cardElement, isChecked) {
            if (isChecked) {
                cardElement.classList.add('memorized');
            } else {
                cardElement.classList.remove('memorized');
            }
        }
    </script>

</body>

</html>
