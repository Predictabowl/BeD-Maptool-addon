<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Gabriela&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4efe6; /* Carta antica */
            --text-color: #2c241a;
            --accent-color: #5d4037; /* Marrone sobrio */
            --border-color: #bfaea2;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: #d1ccc0;
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grimoire-container {
            width: 900px;
            height: 650px;
            background-color: var(--bg-color);
            border: 2px solid var(--accent-color);
            border-radius: 4px;
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Lista */
        .sidebar {
            width: 320px;
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.2);
        }

        .search-area { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .spell-list { overflow-y: auto; flex: 1; }
        
        .spell-item {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .spell-item:hover { background: rgba(93, 64, 55, 0.1); }
        .spell-item.active { background: rgba(93, 64, 55, 0.2); font-weight: bold; }

        /* Contenuto Dettaglio */
        .details-pane {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        h1 { font-family: 'Gabriela', serif; color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }
        .meta { font-style: italic; color: #666; margin-bottom: 20px; }
        .description { line-height: 1.6; font-size: 1.1rem; }

        .badge { font-size: 0.7rem; text-transform: uppercase; border: 1px solid var(--accent-color); padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="grimoire-container">
    <div class="sidebar">
        <div class="search-area">
            <input type="text" id="search" placeholder="Cerca sortilegio..." style="width: 100%; padding: 5px;">
        </div>
        <div class="spell-list" id="spellList"></div>
    </div>

    <div class="details-pane" id="details">
        <h1>Seleziona un Sortilegio</h1>
        <p>Sfoglia le pagine del grimorio per approfondire la conoscenza.</p>
    </div>
</div>

<script>
    // Esempio dati
    const spells = [
        { id: "affascinare", nome_descrittivo: "Affascinare", school: "Incantamento", level: 11, description: ["Il lancio di questo incantesimo può essere mascherato...", "Se la prova riesce la vittima diventa affascinata..."] },
        { id: "allarme", nome_descrittivo: "Allarme", school: "Abiurazione", level: 4, description: ["Crea una zona magica invisibile...", "Il lanciatore può anche scegliere la dimensione..."] }
    ];

    const listEl = document.getElementById('spellList');
    const detailsEl = document.getElementById('details');

    function renderList() {
        listEl.innerHTML = spells.map(s => `
            <div class="spell-item" onclick="showDetails('${s.id}')">
                <span>${s.nome_descrittivo}</span>
                <span class="badge">Lv ${s.level}</span>
            </div>
        `).join('');
    }

    function showDetails(id) {
        const s = spells.find(x => x.id === id);
        detailsEl.innerHTML = `
            <h1>${s.nome_descrittivo}</h1>
            <div class="meta">Scuola di ${s.school} • Livello ${s.level}</div>
            <div class="description">
                ${s.description.map(p => `<p>${p}</p>`).join('')}
            </div>
        `;
    }

    renderList();
</script>
</body>
</html>
