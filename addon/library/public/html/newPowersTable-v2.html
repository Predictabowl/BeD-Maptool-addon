<style>
    /* Contenitore principale della griglia */
    .spells-grid-container {
        display: grid;
        /* Crea colonne automatiche che si adattano, larghezza minima 260px per card */
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 10px;
        max-height: 500px; /* Limita l'altezza con scroll se superano i 30 */
        overflow-y: auto;
        padding: 5px;
    }

    /* La singola Card del Potere */
    .spell-card {
        display: flex;
        align-items: center;
        background-color: var(--bg-card, #2a2a2a);
        border-radius: 6px;
        padding: 6px 10px;
        border: 1px solid #444;
        transition: all 0.2s;
    }

    .spell-card:hover {
        border-color: #666;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Bottone Icona (Lancio rapido) */
    .spell-icon-btn {
        width: 36px;
        height: 36px;
        background: #333;
        border-radius: 4px;
        border: 1px solid #555;
        cursor: pointer;
        margin-right: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1.1rem;
    }

    .spell-icon-btn:hover {
        background: #444;
        border-color: var(--accent-color, #8a2be2);
    }

    /* Nome con il tuo colore di categoria (Badge flessibile) */
    .spell-name-badge {
        flex: 1;
        padding: 6px 8px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 0.9rem;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis; /* Taglia con i 3 puntini se troppo lungo */
    }

    /* Le tue classi colore originali */
    .OFFENSIVO { background-color: #800000; color: white; }
    .MUTAFORMA { background-color: #CC6600; color: white; }
    .MARCHIO { background-color: #666666; color: white; }
    .CONTROLLO { background-color: #008080; color: white; }
    .MALATTIA { background-color: #666600; color: white; }
    .MALEDIZIONE { background-color: #4700B8; color: white; }
    .SUPPORTO { background-color: #0000FF; color: white; }
    .SERVITORE { background-color: #008000; color: white; }

    /* Statistiche tattiche compatte in fondo alla card */
    .spell-stats-mini {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        margin-left: 8px;
        font-size: 0.75rem;
        color: #aaa;
        line-height: 1.1;
        flex-shrink: 0;
    }

    .spell-stats-mini span {
        font-weight: bold;
        color: #fff;
    }
    /* Effetto Hover sul badge del nome */
    .spell-name-badge {
        flex: 1;
        padding: 6px 8px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 0.9rem;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        
        /* Transizione fluida per l'effetto hover */
        transition: filter 0.2s ease, transform 0.1s ease;
    }

    /* Quando passi il mouse sopra il nome */
    .spell-name-badge:hover {
        /* Rende il colore di sfondo più brillante del 25% */
        filter: brightness(1.25);
        /* Leggerissimo effetto di sollevamento opzionale */
        transform: translateY(-1px);
    }

    /* Se vuoi che anche il click dia un feedback visivo immediato */
    .spell-name-badge:active {
        filter: brightness(0.9);
        transform: translateY(0);
    }
</style>

<!-- Esempio della griglia con una card inserita -->
<div class="spells-grid-container">
    
    <!-- Card Potere -->
    <div class="spell-card">
        <!-- 1. Icona / Pulsante di lancio -->
        <button class="spell-icon-btn" title="Lancia Subito">🔥</button>
        
        <!-- 2. Nome con colore categoria (Click apre il dialog descrizione) -->
        <div class="spell-name-badge OFFENSIVO" title="Dardo di Fuoco">
            Dardo di Fuoco
        </div>

        <!-- 3. Statistiche compatte (Mana, PF, PA, TE) -->
        <div class="spell-stats-mini">
            <div>M: <span>5</span> | PF: <span>1</span></div>
            <div>PA: <span>2</span> | TE: <span>1</span></div>
        </div>
    </div>

    <!-- Altre card verrebbero generate qui dinamicamente... -->

</div>
