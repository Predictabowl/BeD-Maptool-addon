<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Gabriela&family=New+Rocker&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --font-default: 'EB Garamond', 'Palatino Linotype', 'Book Antiqua', serif;
            --font-title: 'Gabriela', 'Dumbledor 1', 'Palatino Linotype', 'Book Antiqua', serif;
            --font-book: 'Macondo', 'Morris Roman', 'Georgia', serif;
            --font-spell: 'New Rocker', 'Vecna', serif;
            --font-handwritten: 'Homemade Apple', 'Segoe Script', cursive;
            --bg-card: #2a2a2a;
            --border-color: #444;
            --text-color: #ffffff;
            --stats-bg: rgba(0, 0, 0, 0.3);
            --stat-label-color: #aaaaaa;
            --accent-color: #c08a3e;
        }


        body {
            font-family: var(--font-default);

            font-size: 18px;
            line-height: 1.5;
            /* Ottimizza lo spazio verticale tra le righe di testo */
        }

        .light-mode {
            --bg-card: #f0f0f0;
            --border-color: #cccccc;
            --text-color: #222222;
            --stats-bg: rgba(0, 0, 0, 0.05);
            --stat-label-color: #666666;
        }

        div {
            padding: 0px;
            margin: 0px;
        }

        span {
            padding: 0px;
            margin: 0px;
        }

        /* --- CONTENITORE DELLA GRIGLIA PRINCIPALE --- */
        .spells-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            grid-auto-rows: max-content;
            gap: 2px;
            max-height: 100%vh;
            overflow-y: auto;
            padding: 3px 10px 3px 2px;
        }

        /* --- SINGOLA CARD DEL POTERE --- */
        .spell-card {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border-radius: 6px;
            padding: 3px 10px;
            border: 1px solid var(--border-color);
            gap: 6px;
            transition: all 0.2s ease;
            cursor: grab;
        }

        /* Effetto visivo sulla card mentre viene trascinata */
        .spell-card.dragging {
            opacity: 0.4;
            border: 2px dashed var(--accent-color, #8a2be2);
        }

        /* Cambia il cursore sulla card per indicare che è afferrabile */

        .spell-card:active {
            cursor: grabbing;
        }

        .spell-card:hover {
            border-color: #666;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* --- BOTTONE ICONA (Aggiornato con effetto zoom e pressione) --- */
        .spell-icon-btn {
            width: 32px;
            /* Leggermente più piccolo di base come richiesto */
            height: 32px;
            background: #333;
            border-radius: 4px;
            border: 1px solid #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1rem;

            /* Gestione fluida delle animazioni di scala */
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        /* Quando fai hover: l'icona si ingrandisce (es. scala a 1.25) */
        .spell-icon-btn:hover {
            background: #3a3a3a;
            border-color: var(--accent-color, #8a2be2);
            transform: scale(1.25);
        }

        /* Quando premi il bottone: l'icona si rimpicciolisce simulando la pressione */
        .spell-icon-btn:active {
            transform: scale(0.90);
        }

        /* --- BADGE DEL NOME --- */
        .spell-name-badge {
            flex: 1;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            font-family: var(--font-spell);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .spell-name-badge:hover {
            transform: translateY(-1px);
            background-image: linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15));
        }


        /* --- GRIGLIA DELLE 6 STATISTICHE --- */
        .spell-stats-grid {
            display: grid;
            /* Usiamo 1fr per ogni colonna così tutti gli elementi rimangono allineati verticalmente */
            grid-template-columns: repeat(3, 1fr);
            gap: 2px 2px;
            font-size: 0.8rem;
            background: var(--stats-bg);
            padding: 0px 2px;
            border-radius: 4px;
            text-align: left;
            flex-shrink: 0;
            width: 160px;
            /* Dà una larghezza fissa complessiva al blocco stats, stabilizzandolo */
        }

        .stat-box {
            display: flex;
            gap: 3px;
            align-items: baseline;
            justify-content: flex-start;
            width: 100%;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--stat-label-color);
            /*font-weight: bold;*/
        }

        .stat-value {
            font-weight: bold;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            /* Mantiene il valore sulla stessa riga */
        }

        .recupero-container {
            position: relative;
            display: inline-block;
        }

        .recupero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            /* Background with 50% opacity (rgba) */
            background-color: rgba(0, 123, 255, 0.5);
            color: white;
            font-weight: bold;
            font-size: 18px;

            /* Center the number inside the overlay */
            display: flex;
            align-items: center;
            justify-content: center;

            /* Match the input's border radius if it has one */
            border-radius: 4px;

            /* CRITICAL: Allows clicks to pass through to the input underneath */
            pointer-events: none;

            /* Optional: Smooth transition if you want to hide it on focus */
            transition: opacity 0.2s ease;
        }

        /* DEPRECATED */
        .splitSpellList {
            /*	height: 68%;*/
            width: 100%;
            position: fixed;
            z-index: 1;
            top: 55px;

            bottom: 0px;
            overflow-y: scroll;
        }


        /* --- GRIGLIA DEL GRIMORIO (Per righe) --- */
        .grimoire-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* --- CARD DEL LIBRO --- */
        .grimoire-card {
            display: flex;
            align-items: center;
            background-color: #e0e0e0;
            /* Sfondo chiaro e visibile */
            color: #222222;
            border-radius: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            gap: 10px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .grimoire-card:hover {
            border-color: #666;
            background-color: #323232;
        }

        /* Stato Memorizzato */
        .grimoire-card.memorized {
            border-color: var(--accent-color);
            color: var(--text-color);
            background-color: var(--bg-card);
        }

        .grimoire-card .spell-stats-grid {
            /* Scuriamo drasticamente lo sfondo delle stats sulla card chiara, 
               così i colori originali (Mana, Fatica, ecc.) e le label risaltano perfettamente */
            background: rgba(0, 0, 0, 0.75);
        }

        /* --- STILE PER LA BARRA DEI CONTROLLI (Conferma, Annulla, Contatore) --- */
        .grimoire-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* Spinge a sinistra i pulsanti e a destra il contatore */
            gap: 15px;
            padding: 5px 2px;
        }

        /* Gruppo pulsanti a sinistra */
        .grimoire-actions {
            display: flex;
            gap: 10px;
        }

        /* Stile dei pulsanti */
        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-confirm:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-cancel:hover {
            background: #444;
            border-color: #777;
        }

        /* Stile del contatore a destra */
        .grimoire-counter {
            font-size: 0.95rem;
            font-weight: bold;
            color: #000000;
        }

        /* Stile quando si supera il limite */
        .over-limit {
            color: #ff4d4d;
            /* Rosso allarme */
            font-weight: 900;
            text-shadow: 0 0 4px rgba(255, 77, 77, 0.4);
        }

        .OFFENSIVO {
            background-color: #800000;
            color: white;
            text-align: left;
        }

        .MUTAFORMA {
            background-color: #CC6600;
            color: white;
            text-align: left;
        }

        .MARCHIO {
            background-color: #666666;
            color: white;
            text-align: left;
        }

        .CONTROLLO {
            background-color: #008080;
            color: white;
            text-align: left;
        }

        .MALATTIA {
            background-color: #666600;
            color: white;
            text-align: left;
        }

        .MALEDIZIONE {
            background-color: #4700B8;
            color: white;
            text-align: left;
        }

        .SUPPORTO {
            background-color: #0000FF;
            color: white;
            text-align: left;
        }

        .SERVITORE {
            background-color: #008000;
            color: white;
            text-align: left;
        }

        /* --- COLORI DELLE RISORSE --- */
        .manaFont {
            color: #4d4dff;
            font-weight: bold;
        }

        .faticaFont {
            color: #ffd700;
            font-weight: bold;
        }

        .tempoFont {
            color: #32cd32;
            font-weight: bold;
        }

        .azioneFont {
            color: #ff4d4d;
            font-weight: bold;
        }

        .mmFont {
            color: #ff6600;
            font-weight: bold;
        }

        .ppFont {
            color: #D100D1;
            font-weight: bold;
        }



        /* --- PANNELLI DEGLI SPIRITI --- */
        .spirits-main-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px 0;
        }

        .spirit-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s ease;
        }

        /* Spirito Attivo - Bordo dorato/bronzo ed effetto glow */
        .spirit-panel.is-active {
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 12px rgba(192, 138, 62, 0.4);
            /* Glow basato sul tuo accent-color */
        }

        /* Intestazione dello Spirito */
        .spirit-header {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .spirit-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .spirit-name {
            margin: 0;
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: var(--accent-color);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* --- STATISTICHE SPIRITO (Devozione e Probabilità) --- */
        .spirit-stats-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
        }

        /* Badge Probabilità */
        .prob-badge {
            background: #222;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #e0e0e0;
            font-weight: bold;
        }

        .prob-value {
            color: #32cd32;
            /* Verde per la % di successo */
        }

        /* Barra Devozione */
        .devotion-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .devotion-track {
            width: 120px;
            height: 10px;
            background-color: #111;
            border: 1px solid #444;
            border-radius: 5px;
            overflow: hidden;
        }

        .devotion-fill {
            height: 100%;
            /* Un gradiente blu/azzurro "spirituale". Puoi cambiarlo se preferisci */
            background: linear-gradient(90deg, #4682b4, #5bc0de);
        }

        .devotion-text {
            font-weight: bold;
            color: #aaa;
        }

        /* Contenitore interno per i poteri (margini interni) */
        .spirit-body {
            padding: 10px;
        }

        /* Bottone di richiamo modificato per lo stato attivo */
        .btn-active-spirit {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            cursor: default;
        }

        .btn-active-spirit:hover {
            background: transparent;
            border-color: var(--accent-color);
        }
    </style>
</head>

<body>

    <div class="spirits-main-container">

        <!-- ========================================== -->
        <!-- SPIRITO 1 (ATTIVO)                         -->
        <!-- ========================================== -->
        <div class="spirit-panel is-active">
            <div class="spirit-header">
                <div class="spirit-info">
                    <h3 class="spirit-name">Ifrit, il Signore delle Fiamme</h3>

                    <div class="spirit-stats-row">
                        <span class="prob-badge">Richiamo: <span class="prob-value">100%</span></span>

                        <div class="devotion-wrapper" title="Devozione: 85/100">
                            <span class="devotion-text">Devozione</span>
                            <div class="devotion-track">
                                <!-- In MapTool, imposti la width dinamicamente calcolando (attuale/massimo)*100 -->
                                <div class="devotion-fill" style="width: 85%;"></div>
                            </div>
                            <span class="devotion-text">85/100</span>
                        </div>
                    </div>
                </div>

                <!-- Essendo già attivo, mostriamo un indicatore invece del pulsante -->
                <button class="btn btn-active-spirit" disabled>Spirito Attivo</button>
            </div>

            <div class="spirit-body">
                <!-- Riutilizziamo la griglia del grimorio per i poteri -->
                <div class="grimoire-grid-container" style="max-height: none;">

                    <!-- Card Potere 1 -->
                    <div class="grimoire-card memorized">
                        <div class="spell-name-badge OFFENSIVO">Palla di Fuoco</div>
                        <div class="spell-stats-grid">
                            <div class="stat-box"><span class="stat-label">M:</span><span
                                    class="stat-value manaFont">5</span></div>
                            <div class="stat-box"><span class="stat-label">PF:</span><span
                                    class="stat-value faticaFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">TE:</span><span
                                    class="stat-value tempoFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">PA:</span><span
                                    class="stat-value azioneFont">2</span></div>
                            <div class="stat-box"><span class="stat-label">PP:</span><span
                                    class="stat-value ppFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">MM:</span><span
                                    class="stat-value mmFont">0</span></div>
                        </div>
                    </div>

                    <!-- Card Potere 2 -->
                    <div class="grimoire-card memorized">
                        <div class="spell-name-badge SUPPORTO">Tocco di CalorePalla di Fuoco</div>
                        <div class="spell-stats-grid">
                            <div class="stat-box"><span class="stat-label">M:</span><span
                                    class="stat-value manaFont">5</span></div>
                            <div class="stat-box"><span class="stat-label">PF:</span><span
                                    class="stat-value faticaFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">TE:</span><span
                                    class="stat-value tempoFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">PA:</span><span
                                    class="stat-value azioneFont">2</span></div>
                            <div class="stat-box"><span class="stat-label">PP:</span><span
                                    class="stat-value ppFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">MM:</span><span
                                    class="stat-value mmFont">0</span></div>
                        </div>
                    </div>
                    <!-- Altre card... -->
                </div>
            </div>
        </div>


        <!-- ========================================== -->
        <!-- SPIRITO 2 (INATTIVO)                       -->
        <!-- ========================================== -->
        <div class="spirit-panel">
            <div class="spirit-header">
                <div class="spirit-info">
                    <h3 class="spirit-name">Shiva, la Regina dei Ghiacci</h3>

                    <div class="spirit-stats-row">
                        <!-- Probabilità inferiore -->
                        <span class="prob-badge">Richiamo: <span class="prob-value"
                                style="color:#ffd700">65%</span></span>

                        <div class="devotion-wrapper">
                            <span class="devotion-text">Devozione</span>
                            <div class="devotion-track">
                                <div class="devotion-fill" style="width: 30%;"></div>
                            </div>
                            <span class="devotion-text">30/100</span>
                        </div>
                    </div>
                </div>

                <!-- Essendo inattivo, c'è il pulsante per richiamarlo -->
                <!-- In MapTool questo punterà a una macro per cambiare lo spirito attivo -->
                <button class="btn btn-confirm"
                    onclick="window.location='macro://RichiamaSpirito@Token/All/id=Shiva'">Richiama</button>
            </div>

            <div class="spirit-body">
                <!-- Griglia dei poteri di Shiva -->
                <div class="grimoire-grid-container" style="max-height: none;">

                    <div class="grimoire-card memorized">
                        <div class="spell-name-badge CONTROLLO">Muro di Ghiaccio</div>
                        <div class="spell-stats-grid">
                            <div class="stat-box"><span class="stat-label">M:</span><span
                                    class="stat-value manaFont">4</span></div>
                            <div class="stat-box"><span class="stat-label">PF:</span><span
                                    class="stat-value faticaFont">2</span></div>
                            <div class="stat-box"><span class="stat-label">TE:</span><span
                                    class="stat-value tempoFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">PA:</span><span
                                    class="stat-value azioneFont">1</span></div>
                            <div class="stat-box"><span class="stat-label">PP:</span><span
                                    class="stat-value ppFont">0</span></div>
                            <div class="stat-box"><span class="stat-label">MM:</span><span
                                    class="stat-value mmFont">1</span></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</body>
