<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Capacità</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Gabriela&family=New+Rocker&family=Macondo&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../addon/library/public/css/GlobalCss.css">
    <link rel="stylesheet" href="../../addon/library/public/css/GeneralSkills.css">

</head>

<body class="light-mode">

    <div class="capacita-frame">

        <div class="capacita-header">
            <h2>Capacità</h2>
            <div class="visibility-toggle">
                <button id="btn-secret" class="active" onclick="setVisibility('secret')">Segreto</button>
                <button id="btn-public" onclick="setVisibility('public')">Visibile</button>
            </div>
        </div>

        <div class="circostanza-bar">
            <label for="circostanza">Mod. Circostanza</label>
            <input type="number" id="circostanza" value="0">
            <span class="hint">si applica al prossimo tiro</span>
        </div>

        <div class="skill-list" id="skill-list">
            <!-- rows injected by JS from SKILLS array below -->
        </div>

        <div class="last-roll">
            <span class="label">Ultimo tiro</span>
            <span class="result empty" id="last-roll-result">—</span>
        </div>

    </div>

    <script>
        // Skill name -> modifier value (placeholder values, wire these to real char data)
        const SKILLS = {
            "Acrobazia": 2,
            "Arcanologia": 0,
            "Atletica": 3,
            "Autorità": -1,
            "Erudizione": 1,
            "Fitness": 2,
            "Furtività": 4,
            "Intrattenimento": 0,
            "Lotta": 1,
            "Manualità": 0,
            "Medicina": -1,
            "Percezione": 3,
            "Perspicacia": 1,
            "Persuasione": 0,
            "Resilienza": 2,
            "Sociologia": -1,
            "Sopravvivenza": 1,
            "Tenacia": 2
        };

        let visibility = "secret"; // "secret" | "public"

        function setVisibility(mode) {
            visibility = mode;
            document.getElementById("btn-secret").classList.toggle("active", mode === "secret");
            document.getElementById("btn-public").classList.toggle("active", mode === "public");
        }

        function modClass(v) {
            if (v > 0) return "positive";
            if (v < 0) return "negative";
            return "";
        }

        function buildSkillList() {
            const list = document.getElementById("skill-list");
            list.innerHTML = "";
            Object.entries(SKILLS).forEach(([name, mod]) => {
                const row = document.createElement("div");
                row.className = "skill-row";
                row.innerHTML = `
                <span class="skill-name">${name}</span>
                <span class="skill-mod ${modClass(mod)}">${mod >= 0 ? "+" : ""}${mod}</span>
                <button class="roll-btn" title="Tira ${name}" onclick="rollSkill('${name}', ${mod})">🎲</button>
            `;
                list.appendChild(row);
            });
        }

        function rollSkill(name, mod) {
            const circostanza = parseInt(document.getElementById("circostanza").value, 10) || 0;

            const d20 = Math.floor(Math.random() * 20) + 1;
            const total = d20 + mod + circostanza;

            const resultEl = document.getElementById("last-roll-result");
            resultEl.classList.remove("empty");
            resultEl.textContent = `${name}: ${d20} + ${mod}${circostanza !== 0 ? (circostanza > 0 ? " +" : " ") + circostanza : ""} = ${total} (${visibility === "secret" ? "Segreto" : "Pubblico"})`;

            // Circumstance modifier is consumed after one roll, per spec
            document.getElementById("circostanza").value = 0;
        }

        buildSkillList();
    </script>

</body>

</html>
